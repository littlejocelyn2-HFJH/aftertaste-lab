<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回味製研所：情感特調</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=LXGW+WenKai+TC:wght@400;700&family=DM+Serif+Display&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<script src="config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<style>
:root{
  --paper:#F6F1E7; --card:#FFFDF8; --ink:#1E1A16; --soft:#6E655B; --line:#2A241F;
  --toast:#C8823E; --crust:#9C5A24; --butter:#F3D29B; --matcha:#C3CFA0; --gray:#DAD6CE; --rule:#E7DDCC;
  --r:22px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --latin:"DM Serif Display",Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.8;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--crust)}
.wrap{max-width:860px;margin:0 auto;padding:16px 18px 90px}

/* 直書：逐字堆疊（存圖時也不會跑版） */
.vstack{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.vstack i{font-style:normal;display:block}
.tag{display:inline-flex;background:#fff;border:1.5px solid var(--line);padding:9px 5px;font-size:14px;font-weight:500;box-shadow:2px 2px 0 rgba(30,26,22,.10);letter-spacing:0}
.tag .vstack{gap:3px}
.tag.butter{background:var(--butter)} .tag.matcha{background:var(--matcha)} .tag.gray{background:var(--gray)}
.hz-tag{display:inline-block;border:1.5px solid var(--line);background:#fff;padding:1px 12px;font-size:15px;border-radius:4px}

/* ── Hero ── */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0 6px}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding-top:6px}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--serif);font-weight:900;font-size:15px;align-self:flex-start}
.badge small{font-family:var(--latin);font-weight:400;font-size:11px;line-height:1.1;text-align:center}
.hero-lead{font-size:16px;color:var(--soft);margin:0;line-height:2}
.hero-v{display:flex;flex-direction:row-reverse;gap:12px;align-items:flex-start}
.v-xl{font-family:var(--serif);font-weight:900;font-size:clamp(48px,12.5vw,86px);margin:0;line-height:1}
.v-xl .vstack{gap:.08em}
.v-l{font-family:var(--serif);font-weight:900;font-size:clamp(26px,6.6vw,44px);margin:1.3em 0 0;line-height:1}
.v-l .vstack{gap:.12em}
.v-s{font-size:13px;color:var(--soft);margin:0;line-height:1}
.v-s .vstack{gap:.35em}
.slices{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;margin:26px 0 0}
.slice{position:relative;flex:1;max-width:110px;aspect-ratio:.9;border-radius:46% 46% 10px 10px/36% 36% 10px 10px;
  background:radial-gradient(ellipse at 50% 60%,#F2CF96 0 52%,#D99A55 66%,#A9652B 100%);box-shadow:inset 0 -6px 10px rgba(120,60,20,.25)}
.slice::after{content:"";position:absolute;left:18%;right:18%;top:30%;bottom:16%;border-radius:22%;background:var(--c);opacity:.92;box-shadow:inset 0 0 8px rgba(255,255,255,.5)}
.slice .tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:2;font-size:12px;padding:6px 3px}
.slice b{position:absolute;bottom:22%;left:0;right:0;text-align:center;z-index:2;font-size:22px}
.latin-title{grid-column:1/-1;font-family:var(--latin);font-size:clamp(40px,10vw,78px);line-height:.95;margin:22px 0 0;letter-spacing:-.01em}
.latin-title small{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.1em;margin-top:6px}
.hand{font-family:"Caveat",cursive;color:var(--toast);font-size:.42em;display:inline-block;transform:rotate(-8deg);margin-left:.3em}

/* ── 學生資訊與步驟條 ── */
.who-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:15px;color:var(--soft);margin:18px 0 6px}
.link{background:none;border:0;color:var(--crust);text-decoration:underline;padding:0}
.stepper{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:10px 0;background:linear-gradient(var(--paper) 80%,rgba(246,241,231,0))}
.stepper button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.stepper b{font-family:var(--latin);font-weight:400;font-size:20px}
.stepper span{font-size:12.5px}
.stepper button.on{background:var(--ink);color:var(--paper)}
.stepper button.done{background:var(--butter)}
.stepper button:disabled{opacity:.38;cursor:not-allowed}

/* ── 工序卡 ── */
.stage{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:30px 22px 24px;margin-top:22px;box-shadow:0 10px 30px -18px rgba(90,60,30,.35)}
.stage>.tag.hang{position:absolute;top:-14px;left:20px}
.stage-head{padding-left:44px;min-height:60px}
.kicker{margin:0;font-family:var(--latin);font-size:15px;color:var(--toast);letter-spacing:.06em}
.stage h2{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,38px);margin:0;line-height:1.3}
.lead{font-size:19px;margin:16px 0 18px}
.field{display:block;margin:14px 0}
.field>span{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=password],input[type=number],input:not([type]),textarea,select{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;font-size:20px;line-height:1.7}
textarea{resize:vertical;min-height:200px}
input:focus,textarea:focus,select:focus{outline:3px solid var(--butter);outline-offset:1px}
.counter{text-align:right;font-size:14px;color:var(--soft);margin-top:4px}
.counter.ok{color:#4F7A3A}
.note{font-size:14px;color:var(--soft)}
.err{color:#B3392A;font-weight:700;min-height:1.5em;margin:12px 0 0;font-size:16px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions.center{justify-content:center}
.btn{border:0;border-radius:999px;padding:13px 24px;font-size:18px;font-weight:700;background:var(--ink);color:var(--paper);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.toast{background:var(--toast);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 16px;font-size:15px}
.btn.wide{width:100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 步驟一 */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.seg button{border:0;background:#fff;padding:9px 18px;font-size:16px}
.seg button.on{background:var(--ink);color:var(--paper)}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;min-height:220px;border:1.5px dashed var(--soft);border-radius:18px;background:#FFFBF2;cursor:pointer;overflow:hidden;color:var(--soft)}
.drop img{max-width:100%;max-height:420px;display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);background:var(--c)}
.sw.on{box-shadow:0 0 0 3px var(--toast)}
.sz{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:14px}
.sz.on{background:var(--butter)}
.pad-wrap{width:100%}
#pad{display:block;border-radius:18px;border:1.5px dashed var(--soft);touch-action:none;background:#FFFBF2}

/* 步驟二 */
.ta-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ta-head .label{font-weight:700}
.hint-btn{border:1.5px solid var(--line);background:var(--butter);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap}
.hint{background:#FFF6E2;border-left:5px solid var(--toast);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:17px}
.hint p{margin:0 0 4px;font-weight:700}
.hint ul{margin:0;padding-left:1.2em}

/* 步驟三 */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:7px 18px;background:#fff;font-size:18px;user-select:none}
.chip input:checked+span{background:var(--ink);color:var(--paper)}
.chip input:focus-visible+span{outline:3px solid var(--butter)}
#otherName{margin-top:12px;max-width:340px}
.mission{margin-top:22px;border-top:2px dashed var(--rule);padding-top:18px;animation:rise .35s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.mission h3{font-family:var(--serif);font-weight:900;font-size:28px;margin:0}
.mission-text{background:#FFF6E2;border-radius:14px;padding:12px 16px;font-size:18px;margin:10px 0 14px}
.words-label{font-weight:700;margin-bottom:6px}
.words-label small{font-weight:400;color:var(--soft);margin-left:6px}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.word{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px;font-size:17px;box-shadow:2px 2px 0 rgba(30,26,22,.12)}
.word:active{transform:translate(1px,1px);box-shadow:none}
.empty-tip{margin-top:16px;color:var(--soft);text-align:center;padding:24px;border:1.5px dashed var(--rule);border-radius:16px}

/* 步驟四 */
.mixer{display:grid;grid-template-columns:1fr 190px;gap:18px;align-items:center}
.sl{margin:6px 0 12px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.sl-top small{color:var(--soft);font-size:14px;margin-left:4px}
.sl-top b{font-family:var(--latin);font-weight:400;font-size:22px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--c) var(--p,0%),#EDE5D6 var(--p,0%));outline:none;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 2px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.mix-preview{text-align:center}

/* ── 情感食譜卡 ── */
.final-head{text-align:center;margin:26px 0 14px}
.final-head h2{font-family:var(--serif);font-weight:900;font-size:32px;margin:8px 0 0}
.send-state{font-size:16px;margin:6px 0 0}
.code-box{background:#FFF6E2;border-radius:14px;padding:12px;margin:12px auto;max-width:560px;text-align:left}
.code-box textarea{min-height:90px;font-size:13px;font-family:monospace}
.recipe{max-width:620px;margin:0 auto;background:#F7F2E8;border-radius:28px;padding:30px 26px 22px;border:1px solid var(--rule);box-shadow:0 20px 40px -24px rgba(90,60,30,.45);position:relative;overflow:hidden}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rc-brand{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--serif);font-weight:900;font-size:14px}
.rc-brand small{font-family:var(--latin);font-weight:400;font-size:11px}
.rc-meta{font-size:13px;color:var(--soft);line-height:1}
.rc-meta .vstack{gap:.3em}
.rc-title{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:12px}
.rc-title h3{font-family:var(--serif);font-weight:900;margin:0;line-height:1}
.rc-title h3 .vstack{gap:.1em}
.rc-center{display:flex;gap:16px;align-items:flex-start}
.toast-frame{margin:22px auto 6px;max-width:400px;padding:16px 16px 18px;border-radius:44% 44% 16px 16px/30% 30% 16px 16px;
  background:radial-gradient(ellipse at 50% 58%,#F4D7A6 0 56%,#D99A55 70%,#A9652B 100%);box-shadow:inset 0 -8px 14px rgba(120,60,20,.25)}
.toast-frame img{display:block;width:100%;border-radius:38% 38% 12px 12px/22% 22% 12px 12px;margin-top:16%;aspect-ratio:4/3;object-fit:cover;background:#fff}
.rc-people{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.rc-sec{display:flex;gap:14px;margin-top:20px;align-items:flex-start}
.rc-sec>div{flex:1}
.rc-sec h4{font-family:var(--serif);font-weight:900;font-size:20px;margin:0 0 4px}
.rc-sec p{margin:0;font-size:17px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.rc-palette{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
.rc-palette ul{list-style:none;padding:0;margin:0;flex:1;min-width:180px}
.bar-li{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;font-size:15px;margin:3px 0}
.bar{height:10px;border-radius:999px;background:#EDE5D6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.bar-li b{font-family:var(--latin);font-weight:400;text-align:right}
.rc-sum{margin:26px 0 8px;padding:18px 18px 18px 22px;border-left:6px solid var(--toast);background:#fff;border-radius:6px 16px 16px 6px;font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.7}
.rc-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
.rc-foot .latin{font-family:var(--latin);font-size:26px;line-height:1}
.rc-foot small{color:var(--soft);font-size:13px}

.cover{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-bottom:20px}
.cover-cta{text-align:center;margin-top:26px}
.cover-status{font-size:17px;margin:0 0 12px;min-height:1.6em}
.btn.big{font-size:22px;padding:17px 46px;box-shadow:0 10px 24px -10px rgba(156,90,36,.7)}
.cover-steps{font-size:13px;color:var(--soft);letter-spacing:.08em;margin:14px 0 6px}
.cover-links{display:flex;justify-content:center;gap:18px;font-size:14px}
.mini-head{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1.5px solid var(--line);font-family:var(--serif)}
.mini-head b{font-weight:900;font-size:17px}
.who-bar .sp{flex:1}
.st-pill{border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;border:1.5px solid currentColor}
.st-none{color:var(--soft)} .st-ok{color:#3E7A2E;background:#EAF3DF} .st-warn{color:#A0611A;background:#FFF0D6} .st-fail{color:#B3392A;background:#FBE4DF}
.resend-tip{background:#FFF0D6;border:1.5px solid #E2A54B;border-radius:14px;padding:10px 14px;font-size:16px;margin:6px 0}
.stepper .ck{font-style:normal;font-family:var(--sans);font-size:14px;color:#3E7A2E;margin-left:2px}
.stepper button.on .ck{color:#BFE3A6}
.sent-box{max-width:560px;margin:10px auto 0;border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;align-items:center;border:2px solid}
.sent-box:empty{display:none}
.sent-box b{font-size:24px;font-family:var(--serif);font-weight:900}
.sent-box span{font-size:16px}
.sent-box small{font-size:14px;color:var(--soft)}
.sent-box.ok{background:#EAF3DF;border-color:#7FB069;color:#24461A}
.sent-box.local,.sent-box.wait,.sent-box.preview{background:#FFF6E2;border-color:#E2A54B}
.sent-box.fail{background:#FBE4DF;border-color:#D46A57;color:#7A1F12}
.ck-h{font-size:17px;margin:16px 0 6px}
.ck-list{list-style:none;padding:0;margin:0}
.ck-list li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:16px}
.ck-list li small{color:var(--soft)}
.ck-list li.no{color:#B3392A}
.ck-list li .link{margin-left:auto;white-space:nowrap}
.ck-self label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:16px;line-height:1.6;cursor:pointer}
.ck-self input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--toast)}
.pv-bar{background:#FFF6E2;border:1.5px dashed var(--toast);border-radius:16px;padding:12px 16px;margin:10px 0}
.pv-bar p{margin:0 0 8px;font-size:16px}
.all-open .stage{margin-top:34px}
.ov summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov summary::-webkit-details-marker{display:none}
.ov summary b{font-size:20px;display:block}
.ov-arrow{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;font-size:15px;white-space:nowrap}
.ov details[open] .ov-arrow{background:var(--butter)}
.ov-step{border-top:2px dashed var(--rule);margin-top:18px;padding-top:14px;display:flex;gap:14px;align-items:flex-start}
.ov-step>div{flex:1;min-width:0}
.ov-step h3{font-family:var(--serif);font-weight:900;font-size:22px;margin:0 0 6px}
.ov-step h4{font-size:16px;margin:12px 0 4px;color:var(--crust)}
.ov-step p,.ov-step li{font-size:17px;margin:2px 0}
.ov-step ul{margin:2px 0;padding-left:1.2em}
.ov-q{background:#FFF6E2;border-radius:10px;padding:8px 12px;margin:4px 0}
.ov-ph{color:var(--soft);font-style:italic}
.ov-mode{border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.ov-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ov-words span{border:1.5px solid var(--line);border-radius:6px;padding:0 10px;font-size:15px;background:#fff}

/* ── 工序伍：挑選海報 ── */
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{border:2px solid var(--rule);background:#fff;border-radius:18px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;line-height:1.35;text-align:center;transition:transform .15s}
.pick.on{border-color:var(--toast);box-shadow:0 0 0 3px var(--butter);transform:translateY(-3px)}
.pick .mini{position:relative;overflow:hidden;border-radius:4px;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);margin-bottom:8px;pointer-events:none}
.pick b{font-size:16px}
.pick small{font-size:12px;color:var(--soft)}
.pick.on b::before{content:"✓ ";color:var(--toast)}
.pick .zoom{font-size:13px;margin-top:4px}
@media (max-width:520px){ .stepper span{font-size:11px} .stepper b{font-size:17px} .pick-grid{gap:7px} .pick{padding:7px 4px 6px} .pick b{font-size:14px} .pick small{font-size:10.5px} }
/* ── 卡片風格選擇 ── */
.style-pick{max-width:620px;margin:6px auto 16px;text-align:center}
.style-pick p{margin:0 0 8px;font-weight:700}
.sp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-row button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.sp-row button.on{background:var(--ink);color:var(--paper);box-shadow:0 0 0 3px var(--butter)}
.sp-row b{font-size:15px}
.sp-row small{font-size:11.5px;opacity:.75}
.sp-sw{display:block;width:46px;height:34px;border-radius:6px;margin-bottom:4px;border:1px solid rgba(0,0,0,.15)}
.sw-sketch{background:linear-gradient(165deg,#FBF6EE 0 55%,#F3D3C8 56%)}
.sw-zen{background:#fff;border-right:4px solid #A8402C}
.sw-photo{background:linear-gradient(180deg,#C9A27A 0 62%,#F4ECE1 62%);box-shadow:inset 6px 6px 0 -2px rgba(255,255,255,.9)}

.vcols{display:inline-flex;flex-direction:row-reverse;align-items:flex-start;gap:.45em}
.ph{background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#fff}
.hand-font{font-family:"LXGW WenKai TC","Klee One",var(--sans)}

/* ── 風格一：手繪插畫食譜 ── */
.recipe.r-sketch{background:#FBF6EE;border:0;padding:28px 22px 20px;color:#3B3430;font-family:"LXGW WenKai TC",var(--sans);overflow:hidden}
.sk-head{position:relative}
.sk-title{font-family:"LXGW WenKai TC",var(--serif);font-weight:700;font-size:clamp(34px,9.5vw,50px);margin:0;line-height:1.15;transform:rotate(-2deg);transform-origin:left center}
.sk-sub{font-size:23px;margin:2px 0 0 2.4em;transform:rotate(-2deg)}
.sk-who{position:absolute;right:0;top:4px;font-size:14px;text-align:right;line-height:1.5;color:#7A6E66}
.sk-stage{position:relative;padding:46px 0 40px}
.sk-photo{width:56%;aspect-ratio:1;margin:0 auto;border:3px solid #3B3430;border-radius:47% 53% 50% 50%/53% 47% 53% 47%;transform:rotate(-2deg);box-shadow:8px 10px 0 #F3D3C8}
.sk-note{position:absolute;font-size:18px;display:flex;align-items:center;gap:2px;white-space:nowrap;line-height:1.2}
.sk-note svg{width:38px;height:28px;flex:none}
.sk-note.n0{top:10px;left:2%} .sk-note.n0 svg{transform:rotate(10deg)}
.sk-note.n1{top:16px;right:2%;flex-direction:row-reverse} .sk-note.n1 svg{transform:scaleX(-1) rotate(10deg)}
.sk-note.n2{bottom:40px;left:0;flex-direction:column-reverse;align-items:flex-start} .sk-note.n2 svg{transform:scaleY(-1) rotate(-20deg)}
.sk-note.n3{bottom:46px;right:0;flex-direction:column-reverse;align-items:flex-end} .sk-note.n3 svg{transform:scale(-1,-1) rotate(-20deg)}
.sk-flav{position:absolute;width:21%;font-size:13px;color:#7A6E66;text-align:center;line-height:1.3}
.sk-flav b{display:block;font-size:26px}
.sk-flav.f0{left:0;top:42%} .sk-flav.f1{right:0;top:38%}
.sk-bottom{margin:0 -22px -20px;padding:58px 24px 20px;background:linear-gradient(173deg,rgba(243,211,200,0) 0 50px,#F3D3C8 51px)}
.sk-bottom h4{font-family:"LXGW WenKai TC",var(--serif);font-weight:700;font-size:21px;margin:0 0 4px}
.sk-bottom p{font-size:16.5px;line-height:1.95;margin:0;white-space:pre-wrap;word-break:break-word}
.sk-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 24px}
.sk-cols h4::before{content:"● ";font-size:.6em;vertical-align:middle;color:#C9705A}
.sk-pal{display:flex;gap:14px;align-items:center;margin-top:20px;flex-wrap:wrap}
.sk-pal ul{flex:1;min-width:180px}
.sk-pal .bar{background:rgba(255,255,255,.6)}
.sk-ps{font-size:22px;line-height:1.6;margin:20px 0 8px}
.sk-ps em{font-style:normal;font-family:"Caveat",cursive;font-size:30px;color:#C9705A;margin-right:6px}
.sk-foot{display:flex;justify-content:space-between;font-size:13px;color:#7A6E66;border-top:1px dashed rgba(59,52,48,.3);padding-top:8px;margin-top:10px}

/* ── 風格二：日式留白 ── */
.recipe.r-zen{background:#fff;border:1px solid #EEE9E2;border-radius:6px;padding:34px 26px 24px;color:#3A3632;font-family:var(--serif)}
.zn-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.zn-top .zn-photo{order:3;flex-basis:100%}
.zn-cap{font-size:13px;color:#8A7F76;line-height:1;margin-top:150px}
.zn-cap .vstack{gap:.3em}
.zn-right{display:flex;flex-direction:row-reverse;gap:16px;align-items:flex-start}
.zn-date{font-size:15px;font-weight:600;line-height:1}
.zn-date .vstack{gap:.15em}
.zn-title{font-weight:600;color:#A8402C;margin:0;line-height:1;font-size:var(--fs,40px)}
.zn-title .vstack{gap:.12em}
.zn-sum{font-size:14px;color:#A8402C;line-height:1;margin-top:3.6em}
.zn-sum .vstack{gap:.28em}
.zn-photo{width:90%;aspect-ratio:4/3;margin:20px auto 0;border-radius:3px}
.zn-people{text-align:center;font-size:14px;color:#8A7F76;letter-spacing:.2em;margin:12px 0 0}
.zn-sec{margin-top:26px}
.zn-sec h4{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:#A8402C;letter-spacing:.3em;margin:0 0 8px}
.zn-sec h4::after{content:"";flex:1;border-top:1px solid #E6D9CF}
.zn-sec p{font-size:16px;line-height:2.1;margin:0;white-space:pre-wrap;word-break:break-word}
.zn-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:4px 0 10px;background:#F1ECE6}
.zn-bar i{display:block;height:100%}
.zn-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:#6E655B;font-family:var(--sans)}
.zn-foot{text-align:center;font-family:var(--latin);letter-spacing:.14em;font-size:13px;color:#8A7F76;margin-top:30px}

/* ── 風格三：暖光攝影 ── */
.recipe.r-photo{background:#F4ECE1;color:#4A3B30;border:0;padding:0;overflow:hidden}
.pt-hero{position:relative;aspect-ratio:4/5;color:#fff}
.pt-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(70,45,25,.38) 0%,rgba(70,45,25,0) 38%,rgba(70,45,25,0) 62%,rgba(70,45,25,.42) 100%)}
.pt-title{position:absolute;left:22px;top:26px;right:22px;margin:0;font-family:var(--sans);font-weight:700;font-size:clamp(30px,8.6vw,46px);line-height:1.32;letter-spacing:.04em;text-shadow:0 2px 10px rgba(60,35,15,.35)}
.pt-title>span{display:flex;align-items:center;gap:14px}
.pt-title small{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.18em;opacity:.95}
.pt-doodle{position:absolute;width:64px;height:64px}
.pt-doodle.d1{right:20px;top:34%} .pt-doodle.d2{right:30px;top:48%;width:70px} .pt-doodle.d3{left:18px;bottom:24%;width:58px}
.pt-badge{position:absolute;right:-8px;bottom:30%;width:104px;height:104px;border-radius:50%;background:#fff;color:#4A3B30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.35;font-weight:700;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);padding-right:10px}
.pt-badge i{font-style:normal;display:block;width:44px;border-top:1.5px solid #4A3B30;margin-top:4px;position:relative}
.pt-badge i::after{content:"";position:absolute;right:0;top:-5px;width:8px;height:8px;border-top:1.5px solid #4A3B30;border-right:1.5px solid #4A3B30;transform:rotate(45deg)}
.pt-note{position:absolute;right:22px;bottom:22px;max-width:62%;font-size:14px;line-height:1.85;font-weight:500;padding:6px 0 0 14px;text-shadow:0 1px 6px rgba(60,35,15,.5)}
.pt-note::before{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-left:1.5px solid #fff;border-top:1.5px solid #fff}
.pt-body{padding:6px 24px 26px}
.pt-sec{margin-top:22px}
.pt-sec h4{display:flex;align-items:baseline;gap:10px;font-family:var(--sans);font-weight:700;font-size:20px;margin:0 0 6px;color:#9C5A24}
.pt-sec h4 small{font-size:11px;letter-spacing:.18em;color:#B89A7E;font-weight:500}
.pt-sec p{font-size:16.5px;line-height:1.95;margin:0;white-space:pre-wrap;word-break:break-word}
.pt-pal{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
.pt-pal ul{flex:1;min-width:180px}
.pt-pal .bar{background:#E6DACB}
.pt-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:22px;padding-top:10px;border-top:1px solid #E2D4C3;font-size:13px;color:#8C7766}
.pt-foot b{font-family:var(--latin);font-weight:400;font-size:20px;color:#4A3B30}

/* ══ 海報（A4 直式 794×1123） ══ */
.poster-wrap{position:relative;margin:0 auto;overflow:hidden;border-radius:6px;box-shadow:0 24px 50px -24px rgba(60,35,10,.55);cursor:zoom-in}
.poster{width:var(--pw,794px);transform-origin:0 0;position:absolute;top:0;left:0}
.poster .recipe{max-width:none;width:var(--pw,794px);min-height:var(--ph,1123px);margin:0;border-radius:0;box-shadow:none;border:0;display:flex;flex-direction:column}
.poster p{font-size:var(--tf,20px)!important}
.poster .sk-ps,.poster .nt-sum{font-size:calc(var(--tf,20px)*1.45)!important}
.poster .zn-people,.poster .sk-sub,.poster .nt-sub{font-size:revert}
/* 手繪 */
.poster .r-sketch{padding:50px 60px 40px}
.poster .sk-title{font-size:72px}
.poster .sk-sub{font-size:36px!important;margin-left:3em}
.poster .sk-who{font-size:19px;top:10px}
.poster .sk-stage{padding:34px 0 30px}
.poster .sk-photo{width:40%;box-shadow:14px 16px 0 #F3D3C8;border-width:4px}
.poster .sk-note{font-size:28px}
.poster .sk-note svg{width:62px;height:46px}
.poster .sk-note.n0{left:8%} .poster .sk-note.n1{right:8%}
.poster .sk-flav{font-size:19px;width:20%} .poster .sk-flav b{font-size:40px}
.poster .sk-flav.f0{left:4%} .poster .sk-flav.f1{right:4%}
.poster .sk-bottom{flex:1;display:flex;flex-direction:column;margin:0 -60px -40px;padding:70px 60px 34px;background:linear-gradient(175deg,rgba(243,211,200,0) 0 70px,#F3D3C8 71px)}
.poster .sk-bottom h4{font-size:28px}
.poster .sk-cols{grid-template-columns:1fr 1fr;gap:30px}
.poster .sk-pal svg,.poster .nt-pal svg{width:132px;height:132px}
.poster .bar-li{font-size:16px;grid-template-columns:90px 1fr 50px;margin:1px 0}
.poster .sk-pal,.poster .nt-pal{margin-top:18px}
.poster .sk-foot,.poster .nt-foot{margin-top:auto;font-size:15px}
.poster .sk-ps{margin:18px 0 18px}
/* 日式 */
.poster .r-zen{padding:64px 64px 40px}
.poster .zn-top{flex-wrap:nowrap;gap:28px;min-height:560px}
.poster .zn-top .zn-photo{order:0;flex:1;flex-basis:auto;align-self:flex-end;aspect-ratio:4/5;width:auto;margin:0}
.poster .zn-right{order:1}
.poster .zn-title{font-size:calc(var(--fs,40px)*1.6)}
.poster .zn-date{font-size:24px}
.poster .zn-sum{font-size:20px!important;margin-top:4.2em}
.poster .zn-sum *,.poster .zn-date *{font-size:inherit}
.poster .zn-cap{font-size:16px;margin-top:0;align-self:flex-end}
.poster .zn-people{font-size:18px;margin-top:18px}
.poster .zn-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.poster .zn-sec{margin-top:34px}
.poster .zn-sec h4{font-size:18px}
.poster .zn-legend{font-size:16px}
.poster .zn-bar{height:10px}
.poster .zn-foot{margin-top:auto;padding-top:30px;font-size:15px}
/* 暖光攝影 */
.poster .pt-hero{aspect-ratio:auto;height:660px}
.poster .pt-title{left:56px;top:54px;font-size:68px}
.poster .pt-title small{font-size:15px}
.poster .pt-doodle{width:96px;height:96px}
.poster .pt-doodle.d1{right:70px} .poster .pt-doodle.d2{right:90px;width:104px} .poster .pt-doodle.d3{left:50px;width:86px}
.poster .pt-badge{width:150px;height:150px;font-size:18px;right:-6px}
.poster .pt-badge i{width:60px}
.poster .pt-note{right:56px;bottom:44px;max-width:52%;font-size:19px!important;padding:10px 0 0 20px}
.poster .pt-note::before{width:20px;height:20px}
.poster .pt-body{flex:1;display:flex;flex-direction:column;padding:4px 56px 40px}
.poster .pt-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.poster .pt-sec h4{font-size:26px}
.poster .pt-sec h4 small{font-size:13px}
.poster .pt-pal svg{width:132px;height:132px}
.poster .pt-foot{margin-top:auto;font-size:15px}
.poster .pt-foot b{font-size:24px}
/* 全螢幕 */
.poster-full{position:fixed;inset:0;z-index:120;background:rgba(20,16,12,.92);display:flex;align-items:center;justify-content:center}
.pf-host{position:relative;overflow:hidden}
#printHost{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  body>*:not(#printHost){display:none!important}
  #printHost{display:block!important}
  #printHost .poster{position:static;transform-origin:0 0}
  #printHost .poster .recipe{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ── Modal ── */
.modal{position:fixed;inset:0;background:rgba(30,26,22,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}
.modal-card{background:var(--card);border-radius:24px;max-width:460px;width:100%;padding:26px 22px 20px;position:relative;margin:auto}
.modal-card.wide{max-width:700px;background:transparent;padding:0}
.modal-card h2{font-family:var(--serif);font-weight:900;margin:4px 0 2px;font-size:28px}
.reg-head{display:flex;gap:14px;align-items:flex-start}
.teacher-link{display:block;text-align:center;margin-top:16px;font-size:15px}
.x{position:absolute;top:10px;right:12px;border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* ── 教師頁 ── */
.t-head{display:flex;align-items:flex-start;gap:14px;margin:12px 0 16px}
.t-head h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,6vw,36px);margin:0;line-height:1.3}
.t-head p{margin:2px 0 0;color:var(--soft);font-size:15px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 18px;margin:14px 0}
.panel h2{font-family:var(--serif);font-weight:900;font-size:24px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row input,.row select{width:auto;font-size:17px;padding:8px 12px;flex:0 1 auto}
.tbl-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:8px 8px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{font-size:14px;color:var(--soft);font-weight:500}
tr.flag td{background:#FFF0EC}
.pill{display:inline-block;background:#F8D9D2;color:#8E2A1D;border-radius:999px;padding:0 8px;font-size:13px;margin-right:3px}
.mode-note{background:#FFF6E2;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.food-wall{display:flex;flex-wrap:wrap;gap:8px}

/* ── 大屏 ── */
body.screen{background:#16130F;color:#F6F1E7}
.scr{padding:2.2vw 3vw;min-height:100vh;display:flex;flex-direction:column}
.scr-head{display:flex;align-items:center;gap:2vw;flex-wrap:wrap}
.scr-head h1{font-family:var(--serif);font-weight:900;font-size:4vw;margin:0;flex:1;line-height:1.2}
.scr-head select{width:auto;font-size:1.8vw;padding:.3vw 1vw;background:#2A241F;color:#F6F1E7;border-color:#F6F1E7}
.scr-head a{color:#F3D29B;font-size:1.3vw}
.scr-clock{font-family:var(--latin);font-size:2.4vw;color:#F3D29B}
.scr-grid{flex:1;display:grid;grid-template-columns:1fr 1.2fr 1.1fr;gap:2vw;margin-top:2vw}
.scr-box{background:#241F1A;border-radius:2vw;padding:2vw}
.scr-box h2{font-family:var(--serif);font-size:2.2vw;margin:0 0 1vw;color:#F3D29B}
.scr-num{font-family:var(--latin);font-size:13vw;line-height:1}
.scr-unit{font-size:2.2vw}
.scr-rank{list-style:none;padding:0;margin:0;font-size:2.4vw;line-height:1.75}
.scr-rank b{font-family:var(--latin);font-weight:400;color:#F3D29B;display:inline-block;min-width:2.2em}
.scr-wall{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:1vw;align-items:flex-start;align-content:flex-start;min-height:8vw}
.scr-wall span{background:#F6F1E7;color:#1E1A16;border-radius:.6vw;padding:.3vw 1.2vw;font-size:2vw;font-weight:700}
.scr-legend{font-size:1.9vw;line-height:1.7}
@media (max-width:640px){
  html{font-size:17px}
  .mixer{grid-template-columns:1fr}
  .mix-preview{order:-1}
  .stage{padding:28px 16px 20px}
  .recipe{padding:24px 18px 18px;border-radius:22px}
  .rc-sum{font-size:19px}
}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<!-- ═════════ 學生頁 ═════════ -->
<template id="tpl-student">
<div class="wrap">
  <section id="cover" class="cover">
  <header class="hero">
    <div class="hero-left">
      <div class="badge"><span data-v>回味</span><small>since<br>2026</small></div>
      <p class="hero-lead">一道菜，一段時光。<br>把食物端上桌，<br>把人寫進碗裡，<br>再調出記憶真正的滋味。</p>
    </div>
    <div class="hero-v">
      <h1 class="v-xl" data-v>回味製研所</h1>
      <p class="v-l" data-v>情感特調</p>
      <p class="v-s" data-v>國三散文寫作鷹架</p>
    </div>
    <div class="slices" aria-hidden="true">
      <div class="slice" style="--c:#F1E08A"><span class="tag" data-v>微酸</span><b>🍋</b></div>
      <div class="slice" style="--c:#F6C2BB"><span class="tag" data-v>溫甜</span><b>🍬</b></div>
      <div class="slice" style="--c:#8A6A52"><span class="tag gray" data-v>苦澀</span><b>☕</b></div>
      <div class="slice" style="--c:#DE7A63"><span class="tag" data-v>嗆辣</span><b>🌶️</b></div>
      <div class="slice" style="--c:#E2D7C1"><span class="tag matcha" data-v>鹹香</span><b>🧂</b></div>
    </div>
    <div class="latin-title">Aftertaste<br>LAB<span class="hand">emotional recipe</span><small>MADE IN 國三教室</small></div>
  </header>
  <div class="cover-cta">
    <p class="cover-status" id="coverStatus"></p>
    <button class="btn toast big" id="startBtn">開始調製 →</button>
    <p class="cover-steps">選材上菜 ・ 記憶濾鏡 ・ 人物刻痕 ・ 情感調色 ・ 出餐</p>
    <div class="cover-links"><button class="link" id="coverChange" hidden>不是我，重新登記</button><a href="#preview">老師預覽</a><a href="#scores">教師後台</a></div>
  </div>
  </section>

  <div id="work" hidden>
  <div class="mini-head no-print"><button class="link" id="toCover">← 回首頁</button><b>回味製研所・情感特調</b></div>
  <div class="who-bar no-print"><span id="sendPill" class="st-pill"></span><span class="sp"></span><span id="whoText"></span><button class="link" id="changeWho">更換</button></div>
  <div class="resend-tip" id="resendTip" hidden>✏️ 你已經交過件，但之後又修改了內容。改好後記得到工序肆按「完成特調」<b>重新交件</b>。</div>

  <div class="pv-bar no-print" id="pvBar" hidden>
    <p><b>👀 老師預覽模式</b>：可以自由切換、不必寫完，內容不會記錄、也不會送出。</p>
    <div class="row">
      <button class="btn small" id="pvAll">展開全部工序</button>
      <button class="btn small ghost" id="pvSample">填入範例內容</button>
      <button class="btn small ghost" id="pvClear">清空</button>
      <a class="btn small ghost" href="#scores" style="text-decoration:none">← 回教師後台</a>
    </div>
  </div>

  <nav class="stepper no-print" id="stepper">
    <button data-go="1"><b>01<em class="ck"></em></b><span>選材上菜</span></button>
    <button data-go="2"><b>02<em class="ck"></em></b><span>記憶濾鏡</span></button>
    <button data-go="3"><b>03<em class="ck"></em></b><span>人物刻痕</span></button>
    <button data-go="4"><b>04<em class="ck"></em></b><span>情感調色</span></button>
    <button data-go="5"><b>05<em class="ck"></em></b><span>海報風格</span></button>
  </nav>

  <div id="editor">
    <!-- 步驟一 -->

<script>
(() => {
"use strict";
const CFG = window.MZ_CONFIG || {};
const API = String(CFG.sheetApi || "").trim();
const FLAVORS = [
  {k:"sour",  icon:"🍋", name:"微酸", sub:"委屈／心酸", color:"#E3C64A"},
  {k:"sweet", icon:"🍬", name:"溫甜", sub:"溫馨／快樂", color:"#EE9C92"},
  {k:"bitter",icon:"☕", name:"苦澀", sub:"挫折／辛苦", color:"#6B4A33"},
  {k:"spicy", icon:"🌶️", name:"嗆辣", sub:"衝突／生氣", color:"#C9432B"},
  {k:"salty", icon:"🧂", name:"鹹香", sub:"平淡日常",   color:"#B3A383"}
];
const PEOPLE = ["爸爸","媽媽","阿公","阿嬤","自己","朋友","其他"];
const MODE = {
  A:{title:"⏳ 時間魔法發動",
     text:"時間會在食物上留下痕跡。請寫下他/她『以前』吃這道菜的習慣是什麼？『現在』有改變嗎？你覺得這個改變代表了什麼？",
     words:["歲月","講究","匆忙","細嚼慢嚥","捨不得","變老"]},
  B:{title:"⚔️ 餐桌上的性格對比",
     text:"同一道食物，每個人吃法都不同。請寫出這兩個人吃這道菜『最不同的地方』。他們的吃法，跟他們平常做事的個性有什麼關聯？",
     words:["急躁","條理分明","豪邁","堅持","互補","不拘小節"]}
};
const MIN = {sense:30, core:50, summary:6};
const STYLES = ["sketch", "zen", "photo"];
const COLORS = ["#1E1A16","#9C5A24","#E8A44A","#F3D29B","#C9432B","#7FA05A","#5B83A8","#FFFFFF"];

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const count = s => String(s || "").replace(/\s/g, "").length;
const VPUNC = {"，":"︐","。":"︒","、":"︑","：":"︓","；":"︔","！":"︕","？":"︖","「":"﹁","」":"﹂","『":"﹃","』":"﹄","（":"︵","）":"︶","—":"︱","…":"︙","～":"︴","-":"︱"};
const vt = s => `<span class="vstack">${Array.from(String(s)).map(c => `<i>${esc(VPUNC[c] || c)}</i>`).join("")}</span>`;
const vcols = (s, per) => { const a = Array.from(String(s || "")); const cols = []; for (let i = 0; i < a.length; i += per) cols.push(a.slice(i, i + per).join("")); return `<span class="vcols">${cols.map(vt).join("")}</span>`; };
const applyV = root => $$("[data-v]", root).forEach(el => { el.innerHTML = vt(el.textContent.trim()); });
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const ss = {
  get(k){ try { return sessionStorage.getItem(k) || ""; } catch(e){ return ""; } },
  set(k, v){ try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch(e){} }
};
const pad2 = n => String(n).padStart(2, "0");
function dateStr(iso, withTime){
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`;
  return withTime ? `${s} ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : s;
}
function secsStr(s){ s = Number(s)||0; return s >= 60 ? `${Math.floor(s/60)}分${s%60}秒` : `${s}秒`; }

async function api(body){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "後端錯誤");
  return j;
}

/* ── 本機模式資料庫 ── */
const LDB = {
  all(){ return store.get("mzd_db", {}); },
  save(rec){
    const db = this.all(); const key = rec.cls + "|" + rec.seat;
    const old = db[key] || {cls:rec.cls, seat:rec.seat, name:rec.name, attempts:[], count:0, best:0, image:""};
    const seen = new Set(old.attempts.map(a => a.at));
    const fresh = (rec.attempts||[]).filter(a => a && a.at && !seen.has(a.at));
    let all = old.attempts.concat(fresh).sort((a,b) => String(a.at).localeCompare(String(b.at))).slice(-20);
    const latest = all[all.length-1] || {};
    Object.assign(old, {name:rec.name || old.name, attempts:all, count:old.count + fresh.length,
      best:Math.max(old.best, ...all.map(a => a.chars||0)), last:latest.at||"", food:latest.food||"", flavors:latest.flavors||{}});
    if (rec.image && fresh.length) old.image = rec.image;
    db[key] = old;
    if (!store.set("mzd_db", db)) { old.image = ""; store.set("mzd_db", db); }
    return fresh.length;
  },
  list(){ return Object.values(this.all()); },
  clear(cls){ const db = this.all(); Object.keys(db).forEach(k => { if (db[k].cls === cls) delete db[k]; }); store.set("mzd_db", db); }
};

/* ── 共用：比例、圓餅、食譜卡 ── */
function norm(fl){
  fl = fl || {};
  const tot = FLAVORS.reduce((s,f) => s + (Number(fl[f.k])||0), 0);
  const out = {};
  if (!tot) { FLAVORS.forEach(f => out[f.k] = 0); return out; }
  let acc = 0;
  FLAVORS.forEach((f,i) => { out[f.k] = Math.round((Number(fl[f.k])||0) / tot * 100); acc += out[f.k]; });
  if (acc !== 100) { const top = FLAVORS.slice().sort((a,b) => out[b.k]-out[a.k])[0]; out[top.k] += 100 - acc; }
  return out;
}
function donut(n, size, dark){
  let acc = 0;
  const segs = FLAVORS.map(f => {
    const p = n[f.k] || 0;
    const s = p > 0 ? `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${f.color}" stroke-width="6.5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}"/>` : "";
    acc += p; return s;
  }).join("");
  const top = FLAVORS.slice().sort((a,b) => (n[b.k]||0)-(n[a.k]||0))[0];

      $("#tLoad").textContent = "更新於 " + dateStr(new Date().toISOString(), true).slice(11);
    } catch(e){ $("#tLoad").textContent = "讀取失敗：" + e.message; }
    render();
  }
  function render(){
    $("#tpw").hidden = teacher; $("#tLogin").hidden = teacher; $("#tLogout").hidden = !teacher; $("#goScreen").hidden = !teacher;
    if (teacher) $("#tState").textContent = "老師已登入";
    $("#tOnly").hidden = !teacher;
    const classes = [...new Set(records.map(r => String(r.cls)))].sort();
    if (!classes.includes(cls)) cls = classes[0] || "";
    $("#tCls").innerHTML = classes.length ? classes.map(c => `<option${c===cls?" selected":""}>${esc(c)}</option>`).join("") : "<option value=''>（尚無資料）</option>";
    const rs = records.filter(r => String(r.cls) === cls).sort((a,b) => b.best - a.best || a.seat - b.seat);
    const T = th();
    $("#board").innerHTML = `<tr><th>名次</th><th>座號</th><th>姓名</th><th>料理</th><th>最多字數</th><th>作品數</th>${teacher?"<th>最後完成</th><th>需留意</th>":""}</tr>` +
      (rs.length ? rs.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.seat)}</td><td>${esc(r.name)}</td><td>${esc(r.food)}</td><td>${r.best}</td><td>${r.count}</td>${teacher ?
        `<td>${dateStr(r.last, true)}</td><td>${(r.attempts||[]).filter(a => flagsOf(a, T).length).length || ""}</td>` : ""}</tr>`).join("")
       : `<tr><td colspan="8" class="note">還沒有同學完成。</td></tr>`);
    if (!teacher) return;
    /* 調色盤 */
    const sum = {}; FLAVORS.forEach(f => sum[f.k] = 0);
    rs.forEach(r => { const n = norm(r.flavors); FLAVORS.forEach(f => sum[f.k] += n[f.k]); });
    const n = norm(sum);
    $("#classPalette").innerHTML = rs.length ? donut(n, 150) + bars(n) : "<p class='note'>尚無資料</p>";
    $("#foodWall").innerHTML = rs.map(r => `<span class="hz-tag">${esc(r.food)}<small class="note"> ・${esc(r.seat)}號</small></span>`).join("");
    /* 紀錄表 */
    const fs = $("#fSeat").value.trim(), only = $("#fFlag").checked;
    let rows = [];
    rs.forEach(r => (r.attempts||[]).forEach(a => rows.push({r, a, f:flagsOf(a, T)})));
    rows.sort((x,y) => String(y.a.at).localeCompare(String(x.a.at)));
    if (fs) rows = rows.filter(x => String(x.r.seat) === String(parseInt(fs,10)));
    if (only) rows = rows.filter(x => x.f.length);
    logRows = rows;
    $("#logs").innerHTML = `<tr><th>完成時間</th><th>座號</th><th>姓名</th><th>料理</th><th>共餐者</th><th>字數</th><th>用時</th><th>提醒</th><th></th></tr>` +
      (rows.length ? rows.map((x,i) => `<tr class="${x.f.length?"flag":""}"><td>${dateStr(x.a.at,true)}</td><td>${esc(x.r.seat)}</td><td>${esc(x.r.name)}</td><td>${esc(x.a.food)}</td>
        <td>${esc((x.a.people||[]).join("、"))}</td><td>${x.a.chars||0}</td><td>${secsStr(x.a.secs)}</td><td>${x.f.map(t => `<span class="pill">${t}</span>`).join("")}</td>
        <td><button class="btn small ghost" data-view="${i}">查看</button></td></tr>`).join("") : `<tr><td colspan="9" class="note">沒有符合的紀錄。</td></tr>`);
  }
  let logRows = [];
  $("#logs").addEventListener("click", e => {
    const b = e.target.closest("[data-view]"); if (!b) return;
    const x = logRows[+b.dataset.view];
    const latest = (x.r.attempts||[]).slice(-1)[0];
    $("#vHost").innerHTML = renderCard(x.a, latest && latest.at === x.a.at ? x.r.image : "", x.r, x.a.style);
    $("#viewer").hidden = false;
  });
  $("#vClose").onclick = () => $("#viewer").hidden = true;
  $("#viewer").onclick = e => { if (e.target.id === "viewer") $("#viewer").hidden = true; };

  $("#tLogin").onclick = async () => {
    if (!API) { ss.set("mzd_local_t", "1"); return load(); }
    const p = $("#tpw").value; if (!p) return;
    $("#tState").textContent = "驗證中…";
    try {
      const r = await api({action:"check", password:p});
      if (r.teacher) { pw = p; ss.set("mzd_tpw", p); $("#tState").textContent = ""; load(); }
      else $("#tState").textContent = "密碼錯誤（若 Code.gs 第 8 行仍是 change-me，請先修改並重新部署）。";
    } catch(e){ $("#tState").textContent = "無法連線：" + e.message; }
  };
  $("#tpw").addEventListener("keydown", e => { if (e.key === "Enter") $("#tLogin").click(); });
  $("#tLogout").onclick = () => { pw = ""; ss.set("mzd_tpw", ""); ss.set("mzd_local_t", ""); teacher = false; $("#tState").textContent = ""; load(); };
  $("#goScreen").onclick = () => { location.hash = "#screen"; };
  $("#goPreview").onclick = () => { location.hash = "#preview"; };
  $("#overview").innerHTML = overviewHTML(); applyV($("#overview"));
  $("#ovBox").addEventListener("toggle", () => { $(".ov-arrow").textContent = $("#ovBox").open ? "收合 ▴" : "展開 ▾"; });
  $("#tCls").onchange = e => { cls = e.target.value; store.set("mzd_tcls", cls); render(); };
  $("#tRefresh").onclick = load;
  ["fSeat","fFlag","thSecs","thChars"].forEach(id => $("#" + id).addEventListener("input", render));
  $("#fFlag").addEventListener("change", render);

  $("#copyTsv").onclick = async () => {
    const head = ["完成時間","班級","座號","姓名","料理","共餐者","字數","用時(秒)","提醒","記憶濾鏡","人物刻痕","一句話總結"];
    const clean = s => String(s ?? "").replace(/[\t\r\n]+/g, " ");
    const lines = [head.join("\t")].concat(logRows.map(x => [dateStr(x.a.at,true), x.r.cls, x.r.seat, x.r.name, x.a.food, (x.a.people||[]).join("、"),
      x.a.chars, x.a.secs, x.f.join("、"), x.a.sense, x.a.core, x.a.summary].map(clean).join("\t")));
    try { await navigator.clipboard.writeText(lines.join("\n")); $("#copyTsv").textContent = "已複製 ✓"; }
    catch(e){ alert("瀏覽器不允許複製，請改用「匯出本班 CSV」。"); }
    setTimeout(() => $("#copyTsv").textContent = "複製（貼到 Excel）", 1800);
  };
  $("#exportCsv").onclick = () => {
    const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const head = ["完成時間","班級","座號","姓名","料理","共餐者","寫作任務","記憶濾鏡","人物刻痕",...FLAVORS.map(f => f.name + "%"),"一句話總結","字數","用時(秒)"];
    const rows = [];
    records.filter(r => String(r.cls) === cls).forEach(r => (r.attempts||[]).forEach(a => rows.push([dateStr(a.at,true), r.cls, r.seat, r.name, a.food, (a.people||[]).join("、"),
      (MODE[a.mode]||MODE.A).title, a.sense, a.core, ...FLAVORS.map(f => (a.flavors||{})[f.k]||0), a.summary, a.chars, a.secs])));
    const csv = "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); link.download = `回味製研所_${cls}.csv`; link.click();
  };
  $("#clearCls").onclick = async () => {
    if (!cls) return;
    const ans = prompt(`確定要清除「${cls}」班的所有作品嗎？這個動作無法復原。\n請輸入班級「${cls}」確認：`);
    if (ans !== cls) return;
    try {
      if (API) await api({action:"clearClass", cls, password:pw}); else LDB.clear(cls);
      load();
    } catch(e){ alert("清除失敗：" + e.message); }
  };
  $("#importBtn").onclick = async () => {
    const codes = $("#importText").value.split(/\s+/).filter(s => s.startsWith("MZD1:"));
    if (!codes.length) { $("#importMsg").textContent = "沒有找到作品碼（開頭是 MZD1:）"; return; }
    let ok = 0, bad = 0;
    for (const c of codes) {
      try {
        const rec = JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));
        if (API) await api({action:"save", record:rec}); else LDB.save(rec);
        ok++;
      } catch(e){ bad++; }
    }
    $("#importMsg").textContent = `匯入成功 ${ok} 筆` + (bad ? `，失敗 ${bad} 筆` : "");
    $("#importText").value = ""; load();
  };
  load();
}

/* ═════════ 內容總覽（教師端） ═════════ */
function overviewHTML(){
  const mode = m => `<div class="ov-mode"><p><b>${esc(m.title)}</b></p><p class="ov-q">${esc(m.text)}</p>
    <p class="note" style="margin-top:6px">靈感詞彙庫（按鈕，點一下插入文字框）：</p><div class="ov-words">${m.words.map(w => `<span>［${esc(w)}］</span>`).join("")}</div></div>`;
  return `
  <div class="ov-step"><span class="tag butter" data-v>工序壹</span><div>
    <h3>選材與上菜（視覺設定）</h3>
    <p class="ov-q">請輸入這道充滿記憶的食物名稱，並為它上傳一張照片（或畫下它的樣子）。</p>
    <h4>學生要做的事</h4>
    <ul><li>輸入框：這道食物的名稱 <span class="ov-ph">（提示字：例如：阿嬤的菜脯蛋）</span></li>
    <li>二選一：📷 上傳照片（手機可直接拍照），或 ✏️ 畫下它（8 種顏色、粗細筆、橡皮擦）</li>
    <li>畫布下方說明：用手指或滑鼠畫畫看，不用畫得很像，重點是「你記得的樣子」。</li></ul>
    <h4>過關條件</h4><p>有食物名稱，且有照片或畫。</p>
  </div></div>

  <div class="ov-step"><span class="tag" data-v>工序貳</span><div>
    <h3>記憶濾鏡（感官前奏）</h3>
    <p class="ov-q">先別急著寫人，讓這道菜「出場」。</p>
    <h4>💡 靈感小提示（按鈕展開）</h4>
    <p>不知道怎麼開頭嗎？試著想想：</p>
    <ul><li>這道食物通常出現在什麼特定的時刻？（例如：冬天的宵夜、下雨天、拜拜的桌上）</li>
    <li>它剛端上桌時，有什麼特別的氣味、顏色或是聲音？</li></ul>
    <h4>大文字框</h4><p class="ov-ph">請在這裡寫下這道食物出場的畫面與氣味...</p>
    <h4>過關條件</h4><p>至少 ${MIN.sense} 字。</p>
  </div></div>

  <div class="ov-step"><span class="tag matcha" data-v>工序參</span><div>
    <h3>靈魂人物與刻痕（核心寫作區）</h3>
    <p class="ov-q">誰和你一起吃這道菜？（可複選）</p>
    <div class="ov-words">${PEOPLE.map(p => `<span>☐ ${p}</span>`).join("")}</div>
    <h4>只勾 1 人時出現</h4>${mode(MODE.A)}
    <h4>勾 2 人以上時出現</h4>${mode(MODE.B)}
    <p class="note">勾超過兩位時另有提醒：挑出對比最強烈的兩位來寫。</p>
    <h4>過關條件</h4><p>至少勾 1 人，文字至少 ${MIN.core} 字。</p>
  </div></div>

  <div class="ov-step"><span class="tag gray" data-v>工序肆</span><div>
    <h3>情感調色盤與餘韻（複合情緒歸納）</h3>
    <p class="ov-q">記憶的滋味從來不是單一的。請調配這段回憶的情感比例。</p>
    <h4>五個滑動拉桿（自動換算成 100%，旁邊即時顯示圓餅圖）</h4>
    <ul>${FLAVORS.map(f => `<li>${f.icon} ${f.name}（${f.sub}）</li>`).join("")}</ul>
    <h4>一句話總結</h4>
    <p class="ov-q">最後，請用一句話總結這碗特調的滋味：（例如：這是一碗在微辣衝突中，帶著鹹鹹日常的記憶。）</p>
    <h4>過關條件</h4><p>至少調一種滋味，並寫下總結句。</p>
  </div></div>

  <div class="ov-step"><span class="tag butter" data-v>工序伍</span><div>
    <h3>挑選海報風格（出餐擺盤）</h3>
    <p class="ov-q">文字都寫好了！選一種你喜歡的海報風格，下面是用你自己的作品排出來的樣子。</p>
    <p>三張迷你海報直接用學生的照片與文字排好，可點「🔍 放大看」：手繪食譜、日式留白、暖光攝影。</p>
    <h4>過關條件</h4><p>選定一種風格。按「完成特調・產出海報」後先跳出交件前檢查。</p>
  </div></div>

  <div class="ov-step"><span class="tag butter" data-v>出餐</span><div>
    <h3>情感海報</h3>
    <p>通過交件檢查後，編輯區收起，依學生選的風格產出一張 A4 直式海報，可全螢幕檢視、存成圖片、列印 A4。作品同時送到老師的試算表。</p>
  </div></div>`;
}

/* ═════════ 大屏 ═════════ */
function Screen(){
  mount("#tpl-screen");
  document.body.className = "screen";
  let records = [], cls = store.get("mzd_tcls", "");
  const tick = () => { const d = new Date(); $("#sClock").textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  async function load(){
    try {
      if (API) records = (await api({action:"list"})).records || [];
      else records = LDB.list();
    } catch(e){}
    render();
  }
  function render(){
    const classes = [...new Set(records.map(r => String(r.cls)))].sort();
    if (!classes.includes(cls)) cls = classes[0] || "";
    $("#sCls").innerHTML = classes.map(c => `<option${c===cls?" selected":""}>${esc(c)}</option>`).join("") || "<option>—</option>";
    const rs = records.filter(r => String(r.cls) === cls);
    $("#sDone").textContent = rs.length;
    const sum = {}; FLAVORS.forEach(f => sum[f.k] = 0);
    rs.forEach(r => { const n = norm(r.flavors); FLAVORS.forEach(f => sum[f.k] += n[f.k]); });
    const n = norm(sum);
    const sz = Math.round(window.innerWidth * .14);
    $("#sDonut").innerHTML = donut(n, sz, true);
    $("#sLegend").innerHTML = FLAVORS.map(f => `<div>${f.icon} ${f.name} <b style="font-family:var(--latin);font-weight:400">${n[f.k]}%</b></div>`).join("");
    $("#sRank").innerHTML = rs.slice().sort((a,b) => b.best - a.best).slice(0,5)
      .map((r,i) => `<li><b>${i+1}</b>${esc(r.name)}　<span style="opacity:.7">${r.best} 字</span></li>`).join("") || "<li style='opacity:.6'>等待第一碗出餐…</li>";
    $("#sWall").innerHTML = rs.map(r => `<span>${esc(r.food)}</span>`).join("");
  }
  $("#sCls").onchange = e => { cls = e.target.value; store.set("mzd_tcls", cls); render(); };
  tick(); load();
  timers.push(setInterval(load, 15000), setInterval(tick, 10000));
}

route();
})();
</script>
